<svg width="490" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font-family: 'Courier New', Courier, monospace; font-size: 15px; fill: #c9d1d9; }
    .key { fill: #58a6ff; font-weight: bold; }
    .title { fill: #39d353; font-weight: bold; font-size: 16px; }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(8px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    .row { opacity: 0; animation: fadeIn 0.6s ease-out forwards; }
    .r1 { animation-delay: 0.1s; }
    .r2 { animation-delay: 0.3s; }
    .r3 { animation-delay: 0.5s; }
    .r4 { animation-delay: 0.7s; }
    .r5 { animation-delay: 0.9s; }
    .r6 { animation-delay: 1.1s; }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="6" />
  <g class="text" transform="translate(20, 40)">
    <text y="0" class="row r1 title">aditya@github ~ $ neofetch</text>
    <text y="20" class="row r1">----------------------------</text>

    <text y="55" class="row r2"><tspan class="key">Role:</tspan> B.Tech CSE (Cloud Computing) @ MIT ADT</text>
    <text y="90" class="row r3"><tspan class="key">Stack:</tspan> Java, C/C++, AWS (Lambda, DynamoDB, Bedrock)</text>
    <text y="125" class="row r4"><tspan class="key">Building:</tspan> CivicSync (Automated cloud verification)</text>
    <text y="160" class="row r5"><tspan class="key">Highlights:</tspan> AIforBharat Hackathon Prototype Phase</text>
    <text y="195" class="row r6"><tspan class="key">Interests:</tspan> Chess Strategy, Intense Cinema, GenAI Art</text>
  </g>
</svg>